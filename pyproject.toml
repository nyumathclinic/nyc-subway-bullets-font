[project]
name = "nycbullets"
version = "0.1.0"
description = "Build OpenType color fonts (SVG + COLR) from the NYC Subway bullets on Wikimedia Commons"
requires-python = ">=3.11"
authors = [{ name = "Matthew Leingang", email = "mpl5@nyu.edu" }]
dependencies = [
    "requests>=2.31",
    "lxml>=5",
    "fonttools[unicode]>=4.58",
    "picosvg>=0.22",
    "skia-pathops>=0.8",
]

[project.scripts]
nycbullets = "nycbullets.cli:main"

[dependency-groups]
dev = ["pytest>=8", "uharfbuzz>=0.40"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nycbullets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
